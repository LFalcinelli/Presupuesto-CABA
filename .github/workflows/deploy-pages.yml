name: Publicar sitio en GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-publication
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node tests/preview-package.cjs
      - run: npx playwright install --with-deps chromium
      - name: Comprobar navegación bajo el subpath
        run: |
          npm run dev > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8766/Presupuesto-CABA/ > /dev/null && break; sleep 1; done
          npm run test:smoke
      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'feature/v13-') || startsWith(github.head_ref, 'feature/v14-'))
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - name: Capturas antes y después del bloque v13
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/v13-')
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          case "$HEAD_BRANCH" in *v13-a-*) export QA_BLOCK=A;; *v13-b-*) export QA_BLOCK=B;; *v13-c-*) export QA_BLOCK=C;; esac
          export QA_DIR="$GITHUB_WORKSPACE/qa-v13"
          node baseline/scripts/build.mjs
          PORT=8767 node baseline/scripts/serve.mjs > /tmp/baseline.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8767/Presupuesto-CABA/ > /dev/null && break; sleep 1; done
          QA_PHASE=before SITE_URL=http://127.0.0.1:8767/Presupuesto-CABA/ node scripts/capture-v13.cjs
          QA_PHASE=after SITE_URL=http://127.0.0.1:8766/Presupuesto-CABA/ node scripts/capture-v13.cjs
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/v13-')
        with:
          name: capturas-v13-antes-despues
          path: qa-v13/
          retention-days: 30
      - name: Capturas y controles antes/después de v14
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/v14-')
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          case "$HEAD_BRANCH" in *v14-pbg) export QA_PART=pbg;; *v14-pulido) export QA_PART=pulido;; esac
          export QA_DIR="$GITHUB_WORKSPACE/qa-v14"
          node baseline/scripts/build.mjs
          PORT=8767 node baseline/scripts/serve.mjs > /tmp/baseline.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8767/Presupuesto-CABA/ > /dev/null && break; sleep 1; done
          QA_PHASE=before SITE_URL=http://127.0.0.1:8767/Presupuesto-CABA/ node scripts/capture-v14.cjs
          QA_PHASE=after SITE_URL=http://127.0.0.1:8766/Presupuesto-CABA/ node scripts/capture-v14.cjs
          if [ "$QA_PART" = pulido ]; then EQUALITY_REPORT="$QA_DIR/equality.json" node scripts/compare-v14-audits.cjs "$QA_DIR/before/audit.json" "$QA_DIR/after/audit.json"; fi
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/v14-')
        with:
          name: capturas-v14-antes-despues
          path: qa-v14/
          retention-days: 30
      - name: Recuperar las vistas previas publicadas
        id: previous
        uses: actions/github-script@v8
        with:
          script: |
            const {owner, repo} = context.repo;
            const runs = await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id: 'deploy-pages.yml', status: 'success', per_page: 10});
            for (const run of runs.data.workflow_runs) {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({owner, repo, run_id: run.id});
              if (artifacts.data.artifacts.some(a => a.name === 'github-pages' && !a.expired)) {
                core.setOutput('run', String(run.id)); break;
              }
            }
      - uses: actions/download-artifact@v5
        if: steps.previous.outputs.run != ''
        with:
          name: github-pages
          path: previous-pages
          github-token: ${{ github.token }}
          run-id: ${{ steps.previous.outputs.run }}
      - name: Extraer el artefacto anterior
        if: steps.previous.outputs.run != ''
        run: |
          mkdir previous-site
          tar -xf previous-pages/artifact.tar -C previous-site
      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request'
        with:
          ref: main
          path: production
          persist-credentials: false
      - name: Conservar la versión de producción
        if: github.event_name == 'pull_request'
        run: node production/scripts/build.mjs
      - name: Preparar publicación y preview del PR
        env:
          PREVIEW_PR: ${{ github.event.pull_request.number }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_TRUSTED: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner) }}
        run: node scripts/package-pages.mjs
      - name: Preparar Pages
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner)
        uses: actions/configure-pages@v5
      - name: Subir sólo el sitio construido
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner)
        uses: actions/upload-pages-artifact@v4
        with:
          path: site-package
  deploy:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'github-pages-preview' || 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
